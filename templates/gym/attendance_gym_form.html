{% extends "gym/base.html" %}
{% block title %}Asistencia GYM — Cuerpo Sano{% endblock %}
{% block content %}
  <h2>Registrar asistencia al GYM</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label>{{ field.label }}{{ field }}
        {% for error in field.errors %}<span style="color:#b71c1c;">{{ error }}</span>{% endfor %}
      </label>
    {% endfor %}
    <button type="submit" class="btn">Registrar</button>
    <a class="btn btn-secondary" href="{% url 'gym:attendance_list' %}">Volver</a>
  </form>
{% endblock %}
