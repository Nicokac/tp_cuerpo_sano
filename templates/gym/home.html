{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Login — Cuerpo Sano</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
      form { max-width: 360px; margin: auto; display: grid; gap: .75rem; }
      input, button { padding: .6rem .8rem; }
    </style>
  </head>
  <body>
    <h1>Iniciar sesión</h1>
    {% if form.errors %}<p style="color:#c00">Usuario o contraseña inválidos.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Usuario {{ form.username }}</label>
      <label>Contraseña {{ form.password }}</label>
      <button type="submit">Entrar</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </body>
</html>
